name: Reconcile payments

# Finds payments that landed on chain but that nobody ever confirmed — the
# payer who signed the transfer and closed the tab before /confirm ran — and
# settles or files each one.
#
# THIS IS A BACKSTOP, NOT THE MECHANISM. It used to be the only trigger, and
# that was the bug: reconciliation cannot depend on this workflow arriving on
# time, because it does not. Measured on this repository, two consecutive
# scheduled runs landed 2h29m apart against a schedule asking for every five
# minutes; a second repository averages ~1h32m. GitHub's scheduler is
# best-effort and deprioritises low-activity repositories, and no setting
# here changes that.
#
# LATE_CONFIRM_GRACE_MINUTES is 10. A pass arriving two hours late cannot
# reclaim the colour a payer paid for — it can only file the payment for a
# human. So the ten-minute window is now served by lazy reconciliation on the
# request path (src/lib/payments/lazy-recovery.ts, hooked into
# GET /api/orders/[id] and /join/[orderId]), which cannot be late because the
# payer's own request is the trigger.
#
# What is left for this file is the payer who never comes back, whose order
# no request will ever name. Vercel Cron covers that too (vercel.json, daily
# — Hobby allows one run per day and fires anywhere inside the nominated
# hour). This workflow runs hourly in between, so money sits unfiled for
# about an hour rather than about a day.
#
# WHY IT IS KEPT AT ALL, given the daily sweep exists: the gap between hourly
# and daily is the gap between an operator seeing an unmatched payment the
# same morning and seeing it a day later. That is cheap here — 24 runs a day,
# a few seconds each — and it is the only part of reconciliation that still
# runs when a deployment is otherwise idle.
#
# WHY IT IS NOT DELETED IN FAVOUR OF Vercel Cron alone: it is the only
# trigger that is independent of Vercel. If a deployment is rolled back,
# cron jobs are not updated with it (they keep running the old schedule), and
# a cron job on a path that 404s still reports as executed. This one fails
# loudly, in a log somebody reads, against whatever URL RECONCILE_URL names.
#
# It sends its secret in a header it chooses; Vercel Cron sends the same
# secret as `Authorization: Bearer`, provisioned by the platform. The
# endpoint accepts either — see src/app/api/cron/reconcile/route.ts.

on:
  schedule:
    # Hourly, and deliberately NOT tuned to a deadline any more.
    #
    # This used to ask for every five minutes, on the reasoning that a pass
    # arriving a few minutes late still landed inside LATE_CONFIRM_GRACE_MINUTES
    # and so kept recovery automatic instead of manual. That reasoning was
    # sound and the premise was false: the runs do not arrive a few minutes
    # late, they arrive hours late (see the header). Asking for every five
    # minutes did not buy the window — it bought 288 billable runs a day and a
    # comment claiming a guarantee this file cannot make.
    #
    # Nothing here is load-bearing on timing now, so the interval is chosen on
    # cost alone: hourly is frequent enough that an operator finds an unmatched
    # payment the same morning, and cheap enough to stop thinking about. If
    # GitHub delivers it at 90-minute intervals instead, nothing breaks — that
    # is the difference between this schedule and the one it replaced.
    #
    # The per-pass cost is unchanged and bounded: at most MAX_ORDERS_PER_PASS
    # (20) expired orders, one cheap getSignaturesForAddress each, with the
    # expensive getTransaction calls only for orders something actually named
    # on chain.
    - cron: "17 * * * *"
  workflow_dispatch:

# A run still going when the next one is due should finish, not be raced. The
# endpoint is safe to run twice, but two concurrent passes would examine the
# same orders and spend the RPC calls twice to reach the same answer.
concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call the reconcile endpoint
        env:
          # Repository secret. Must equal CRON_SECRET in the Vercel environment.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Repository variable, so the target can be changed without editing
          # this file. Falls back to the production domain.
          RECONCILE_URL: ${{ vars.RECONCILE_URL || 'https://pixelwar.fun/api/cron/reconcile' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          echo "POST ${RECONCILE_URL}"

          # Body and status are captured separately so a failure can show what
          # the server actually said instead of just a number. The secret goes
          # in a header, never in the URL: a URL is logged by every hop.
          status=$(curl --silent --show-error \
                        --request POST \
                        --header "x-cron-secret: ${CRON_SECRET}" \
                        --header "content-type: application/json" \
                        --max-time 120 \
                        --retry 2 --retry-connrefused --retry-delay 5 \
                        --output response.json \
                        --write-out '%{http_code}' \
                        "${RECONCILE_URL}") || {
            echo "::error::Could not reach ${RECONCILE_URL} at all — check DNS and that the deployment is live."
            exit 1
          }

          echo "HTTP ${status}"
          echo "--- response ---"
          cat response.json || true
          echo

          # Anything outside 2xx is a failure, loudly. A 401 means the secret
          # and the deployment's have drifted apart; a 503 means the deployment
          # has no CRON_SECRET at all and is refusing every request.
          case "${status}" in
            2*) ;;
            401) echo "::error::${status} — the secret was rejected. CRON_SECRET here and in the deployment do not match."; exit 1 ;;
            503) echo "::error::${status} — the deployment says reconciliation is not configured (CRON_SECRET unset there)."; exit 1 ;;
            *)   echo "::error::${status} from ${RECONCILE_URL}"; exit 1 ;;
          esac

          # A 2xx is not enough, and this is the owner's explicit instruction.
          # A deployment can answer 200 with a cached page, an HTML error, a
          # framework's own body, or a JSON object that simply has no counts in
          # it — none of which means a reconcile pass ran, and every one of
          # which passed silently while `// 0` quietly turned a missing count
          # into a plausible-looking zero. The body must PARSE and must carry
          # BOTH counts as numbers before this step is allowed to succeed.
          if ! jq -e '(.recovered | type) == "number" and (.filed | type) == "number"
                       and (.backlog.open | type) == "number"' \
                  response.json > /dev/null 2>&1; then
            echo "::error::${status}, but the body is not the counts JSON this endpoint returns. Nothing here proves a reconcile pass ran — check the deployment above."
            exit 1
          fi

          # Surface what it did. The response carries counts only — no order
          # ids — because this log is retained for ninety days and is public on
          # a public repository.
          recovered=$(jq -r '.recovered' response.json)
          filed=$(jq -r '.filed' response.json)

          {
            echo "### Reconcile"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Payments recovered | ${recovered} |"
            echo "| Filed for a human | ${filed} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${filed}" != "0" ]; then
            echo "::warning::${filed} payment(s) could not be settled automatically and are filed as unmatched. They need a human."
          fi

          # THE BACKLOG, WHICH IS THE PART A WARNING CANNOT CARRY.
          #
          # `filed` above counts what THIS pass could not settle. A payment
          # filed last Monday is not in it, was not in Tuesday's, and will not
          # be in any future one — so for as long as this workflow only
          # reported flow, an unresolved refund produced exactly one line, on
          # one day, in a log nobody opens afterwards.
          #
          # The endpoint now reports the pile as well. Anything open is worth
          # saying; anything open for more than a day FAILS the job, and that
          # is the whole mechanism: a red run emails the repository owner. No
          # new service, no new secret, no integration to keep alive — the
          # alerting channel is the one this repository already has, and the
          # difference between a warning and a failure is whether it reaches
          # somebody who is not looking.
          open=$(jq -r '.backlog.open // 0' response.json)
          age=$(jq -r '.backlog.oldestAgeHours // 0' response.json)
          stale=$(jq -r '.backlog.stale // false' response.json)

          {
            echo "| Unmatched, still open | ${open} |"
            echo "| Oldest, in hours | ${age} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${stale}" = "true" ]; then
            echo "::error::${open} unmatched payment(s) are open and the oldest has waited ${age}h. That is somebody's money sitting in our wallet, credited to nobody. Work the queue at /admin/orphans."
            exit 1
          fi

          if [ "${open}" != "0" ]; then
            echo "::warning::${open} unmatched payment(s) are open; the oldest has waited ${age}h."
          fi
